spring:
  application:
    name: lol-highlight-backend

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-please-change-in-production}
  access-token-validity: 3600000  # 1시간 (1000 * 60 * 60)
  refresh-token-validity: 604800000  # 7일 (1000 * 60 * 60 * 24 * 7)

# OAuth2 리다이렉트 URI
app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}

# Flask AI Server 설정
flask:
  api:
    base-url: ${FLASK_API_URL:http://localhost:8000}
    timeout: 30000
    connection-timeout: 5000

# Riot API 설정
riot:
  api:
    key: ${RIOT_API_KEY:your-riot-api-key}
    base-url: https://developer.riotgames.com

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.lol: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
