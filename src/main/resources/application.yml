spring:
  application:
    name: lol-highlight-backend

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-please-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# OAuth2 redirect configuration
app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}
    error-redirect-uri: ${OAUTH2_ERROR_REDIRECT_URI:http://localhost:3000/auth/error}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.lol: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss}{Asia/Seoul} [%thread] %-5level %logger{36} - %msg%n"

# AI Server 설정
# TODO: [FastAPI 연동] 실제 FastAPI 서버 배포 후 AI_SERVER_URL 환경변수 설정 필요
# 현재는 임시 URL(localhost:8000)로 설정되어 있습니다.
ai:
  server:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    timeout: 30000           # 읽기 타임아웃 (ms)
    connect-timeout: 5000    # 연결 타임아웃 (ms)
    max-retries: 3           # 재시도 횟수

# GCP Cloud Storage 설정
gcp:
  storage:
    project-id: ${GCP_PROJECT_ID:your-gcp-project-id}
    bucket: ${GCP_STORAGE_BUCKET:lol-highlight-bucket}
    match-data-prefix: match-data
    profile-image-prefix: profile-images

# Riot API 설정
riot:
  api:
    key: ${RIOT_API_KEY:your-riot-api-key}
    base-url: https://kr.api.riotgames.com
    asia-url: https://asia.api.riotgames.com

# Match Refresh 설정
match:
  refresh:
    window-minutes: 3      # Rate Limit 윈도우 시간 (분)
    max-count: 5           # 윈도우 내 최대 갱신 횟수
    keep-match-count: 1000 # 유지할 최대 매치 개수 (무제한에 가깝게 설정)
