spring:
  application:
    name: lol-highlight-backend

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul

  h2:
    console:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - email
              - profile

riot:
  api:
    key: ${RIOT_API_KEY}
    base-url: https://kr.api.riotgames.com
    asia-url: https://asia.api.riotgames.com

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

gcp:
  storage:
    project-id: ${GCP_PROJECT_ID}
    bucket: ${GCP_STORAGE_BUCKET}
    match-data-prefix: match-data

logging:
  level:
    root: INFO
    com.lol: INFO
    com.lol.highlight: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  compression:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100

# Match Refresh 설정
match:
  refresh:
    window-minutes: 3      # Rate Limit 윈도우 시간 (분)
    max-count: 5           # 윈도우 내 최대 갱신 횟수
    keep-match-count: 40   # 유지할 최대 매치 개수

# AI Server 설정
ai:
  server:
    base-url: ${AI_SERVER_URL}
    timeout: 30000
